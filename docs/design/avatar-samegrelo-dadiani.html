<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#FFC21A;font-family:'Noto Sans Georgian',sans-serif;padding:24px;width:760px;box-sizing:border-box}
.c{background:#fff;border-radius:26px;padding:18px;display:flex;gap:26px;align-items:center;justify-content:center}.it{text-align:center;font-weight:800;font-size:15px}h1{margin:0 0 12px;font-size:28px}</style>
<h1>სამეგრელო · დადიანების სასახლე</h1><div class="c" id="c"></div>
<script>
const merl=(x0,x1,y,w=5,h=5,c)=>{let s='';for(let x=x0;x<x1-1;x+=w*2)s+=`<rect x="${x}" y="${y-h}" width="${w}" height="${h}" fill="${c}"/>`;return s}
const arch=(x,y,w,h,c)=>`<path d="M${x} ${y+h} V${y+w*0.6} Q${x} ${y} ${x+w/2} ${y-w*0.3} Q${x+w} ${y} ${x+w} ${y+w*0.6} V${y+h}z" fill="${c}"/>`
const P=(wall,dark,win)=>`
 <rect x="22" y="44" width="56" height="36" fill="${wall}"/>${merl(22,78,44,4,5,wall)}
 <rect x="12" y="34" width="16" height="46" fill="${wall}"/>${merl(12,28,34,3,5,wall)}
 <rect x="72" y="34" width="16" height="46" fill="${wall}"/>${merl(72,88,34,3,5,wall)}
 <rect x="40" y="36" width="20" height="44" fill="${wall}"/>${merl(40,60,36,3,5,wall)}
 ${arch(16,44,8,12,win)}${arch(16,62,8,12,win)}${arch(76,44,8,12,win)}${arch(76,62,8,12,win)}
 ${[30,64].map(x=>arch(x,52,6,10,win)+arch(x,66,6,10,win)).join('')}
 ${arch(44,42,12,10,win)}
 <path d="M42 80 V66 h16 V80z" fill="${dark}"/>${arch(45,60,10,20,win)}
 <rect x="8" y="80" width="84" height="5" fill="${dark}"/>
 <path d="M20 85 h60 l4 4 h-68z" fill="${dark}"/>`
const V=[['ღია ქვა','#EFE6D2','#9C8A6A','#5B6B7F','#E3ECF6'],['თეთრი, ცის ფონზე','#F7F3EA','#B0A486','#4A5A70','#CFE6F5'],['მწვანე ბაღით','#EFE6D2','#9C8A6A','#5B6B7F','#DFF3E6']]
document.getElementById('c').innerHTML=V.map(([n,w,d,win,bg],i)=>`<div class="it"><svg viewBox="0 0 100 100" width="180" height="180"><circle cx="50" cy="50" r="50" fill="${bg}"/>${i==2?'<ellipse cx="50" cy="89" rx="38" ry="7" fill="#5FAF5F"/><circle cx="15" cy="78" r="7" fill="#3E9B48"/><circle cx="85" cy="78" r="7" fill="#3E9B48"/>':''}${P(w,d,win)}</svg><div>${String.fromCharCode(65+i)} · ${n}</div></div>`).join('')
</script>
